<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 664" role="img" aria-labelledby="title desc" fill="none" font-family="Pretendard Variable, Pretendard, Malgun Gothic, Segoe UI, sans-serif" font-size="30">
  <title id="title">LiteSim Field Validation Loop</title>
  <desc id="desc">Real sensor and control interfaces connect to a LiteSim validation loop before accepted behavior is checked on a field unmanned forklift</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l8 4-8 4z" fill="#007E7A"/>
    </marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l8 4-8 4z" fill="#2E6FAE"/>
    </marker>
  </defs>

  <rect width="1180" height="664" fill="#F7F6F2"/>
  <rect x="32" y="32" width="1116" height="600" rx="12" fill="#FFFFFF" stroke="#D8DDD7" stroke-width="2"/>
  <g stroke="#D8DDD7" stroke-width="4">
    <path d="M64 32v12m32-12v7m1020-7v12m-32-12v7M64 632v-12m32 12v-7m1020 7v-12m-32 12v-7"/>
    <path d="M32 64h12m-12 32h7m1109-32h-12m12 32h-7M32 600h12m-12-32h7m1116 32h-12m12-32h-7"/>
  </g>

  <text x="72" y="90" fill="#202522" font-size="46" font-weight="700">LiteSim Field Validation Loop</text>
  <text x="1108" y="88" text-anchor="end" fill="#66706B" font-family="ui-monospace, Consolas, monospace">SIM · FIELD</text>
  <path d="M72 116h1036" stroke="#D8DDD7" stroke-width="3"/>

  <g>
    <rect x="72" y="146" width="300" height="320" rx="8" fill="#F7F6F2" stroke="#D8DDD7" stroke-width="2"/>
    <text x="96" y="190" fill="#005C5A" font-family="ui-monospace, Consolas, monospace" font-weight="700">01 · REAL I/O</text>
    <path d="M96 210h252" stroke="#D8DDD7" stroke-width="2"/>
    <rect x="104" y="244" width="236" height="76" rx="6" fill="#FFFFFF" stroke="#D8DDD7" stroke-width="2"/>
    <circle cx="130" cy="282" r="10" fill="#FFFFFF" stroke="#2E6FAE" stroke-width="5"/>
    <path d="M154 270h154M154 294h104" stroke="#2E6FAE" stroke-width="5"/>
    <text x="104" y="360" fill="#202522" font-size="32" font-weight="700">SENSOR I/O</text>
    <rect x="104" y="382" width="236" height="52" rx="6" fill="#FFFFFF" stroke="#D8DDD7" stroke-width="2"/>
    <path d="M128 408h38M184 408h38M240 408h68" stroke="#007E7A" stroke-width="6"/>
    <text x="104" y="462" fill="#66706B">CONTROL I/O</text>
  </g>

