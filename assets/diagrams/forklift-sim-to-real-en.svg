<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1f2430">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b9e4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="19" font-weight="700">Unmanned Forklift Digital Twin — Sim-to-Real Validation Loop</text>

  <!-- perception -->
  <rect x="40" y="90" width="240" height="110" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="160" y="125" text-anchor="middle" font-weight="700">Perception</text>
  <text x="160" y="149" text-anchor="middle" font-size="12">ToF + RGB Sensor Fusion</text>
  <text x="160" y="173" text-anchor="middle" font-size="12">→ DL 6-DOF Pose</text>

  <!-- control -->
  <rect x="40" y="350" width="240" height="110" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="160" y="385" text-anchor="middle" font-weight="700">Real-Time Control SW (C++23)</text>
  <text x="160" y="409" text-anchor="middle" font-size="12">30 ms Deterministic Loop</text>
  <text x="160" y="433" text-anchor="middle" font-size="12">BehaviorTree · Fail-Safe</text>

  <!-- bus -->
  <rect x="450" y="230" width="280" height="120" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="590" y="284" text-anchor="middle" font-weight="700">Zenoh Brokerless Pub/Sub</text>
  <text x="590" y="308" text-anchor="middle" font-size="12" fill="#555">(Shared Message Contract)</text>

  <!-- sim -->
  <rect x="900" y="90" width="240" height="110" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="1020" y="137" text-anchor="middle">Isaac Sim Digital Twin</text>
  <text x="1020" y="161" text-anchor="middle" font-size="12" fill="#555">(Virtual Forklift · Environment · Physics)</text>

  <!-- real -->
  <rect x="900" y="350" width="240" height="110" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="1020" y="397" text-anchor="middle" font-weight="700">Real Unmanned Forklift</text>
  <text x="1020" y="421" text-anchor="middle" font-size="12" fill="#555">(Field Deployment)</text>

  <!-- edges -->
  <g fill="none" stroke="#555" stroke-width="1.6">
    <path d="M160,200 L160,350" marker-end="url(#arr)"/>
    <path d="M280,145 L365,145 L365,265 L450,265" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M280,405 L365,405 L365,315 L450,315" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M730,265 L815,265 L815,145 L900,145" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M730,315 L815,315 L815,405 L900,405" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <path d="M1020,200 L1020,350" fill="none" stroke="#5b9e4f" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrG)"/>

  <text x="172" y="280" font-size="11" fill="#555">Pose</text>
  <text x="824" y="200" font-size="11" fill="#555">Same Messages</text>
  <text x="824" y="362" font-size="11" fill="#555">Same Messages</text>
  <text x="1008" y="279" text-anchor="end" font-size="11" fill="#3f7a36" font-weight="700">① Simulator Validation → ② Real-Vehicle Application</text>
</svg>
