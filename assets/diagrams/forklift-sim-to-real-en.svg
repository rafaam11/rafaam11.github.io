    <text x="230" y="570" text-anchor="middle" fill="#202522" font-weight="700">REVALIDATE</text>
    <text x="590" y="570" text-anchor="middle" fill="#202522" font-weight="700">EDGE CASE</text>
    <text x="950" y="570" text-anchor="middle" fill="#202522" font-weight="700">FIELD OBSERVE</text>
