    <rect x="440" y="146" width="300" height="320" rx="8" fill="#FFFFFF" stroke="#007E7A" stroke-width="4"/>
    <text x="464" y="190" fill="#005C5A" font-family="ui-monospace, Consolas, monospace" font-weight="700">02 · LITESIM</text>
    <path d="M464 210h252" stroke="#D8DDD7" stroke-width="2"/>
    <circle cx="590" cy="310" r="86" fill="#F7F6F2" stroke="#D8DDD7" stroke-width="3"/>
    <path d="M540 274a62 62 0 0 1 98-2" stroke="#007E7A" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M640 346a62 62 0 0 1-98 2" stroke="#2E6FAE" stroke-width="6" marker-end="url(#return)"/>
