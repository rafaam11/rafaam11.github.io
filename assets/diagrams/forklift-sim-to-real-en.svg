  <g>
    <rect x="72" y="510" width="1036" height="88" rx="6" fill="#F7F6F2" stroke="#D8DDD7" stroke-width="2"/>
    <path d="M1028 556H154" stroke="#2E6FAE" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#return)"/>
    <g fill="#FFFFFF" stroke="#2E6FAE" stroke-width="3">
