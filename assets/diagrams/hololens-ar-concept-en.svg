<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1f2430">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="600" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="19" font-weight="700">HoloLens AR Patient Digital Twin — Surgeon View</text>

  <!-- tracker -->
  <rect x="350" y="70" width="360" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="530" y="104" text-anchor="middle">Stereo-Vision Tracker</text>
  <text x="530" y="126" text-anchor="middle" font-size="12" fill="#555">(Live 6-DOF Marker · Tool Tracking)</text>

  <!-- surgeon -->
  <ellipse cx="135" cy="370" rx="100" ry="72" fill="#f5f5f5" stroke="#666"/>
  <text x="135" y="364" text-anchor="middle">Surgeon</text>
  <text x="135" y="386" text-anchor="middle" font-size="12" fill="#555">· Wearing HoloLens 2</text>

  <!-- MR view container -->
  <rect x="300" y="200" width="840" height="360" rx="10" fill="#faf7fc" stroke="#9673a6"/>
  <text x="720" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#6d4f87">HoloLens MR View (Surgeon)</text>

  <!-- real -->
  <rect x="340" y="270" width="320" height="250" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="500" y="382" text-anchor="middle" font-weight="700">Real Patient</text>
  <text x="500" y="406" text-anchor="middle">+ Tracked Surgical Tool</text>
  <text x="500" y="430" text-anchor="middle" font-size="12" fill="#555">(Stereo-Vision Tracking)</text>

  <!-- virtual -->
  <rect x="720" y="262" width="384" height="270" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-dasharray="6 4"/>
  <text x="742" y="300" font-weight="700">Virtual Patient Hologram = Patient Digital Twin</text>
  <text x="748" y="352">• Hidden Nerves · Vessels</text>
  <text x="748" y="388">• Surgical-Plan Guide Overlay</text>
  <text x="748" y="424">• Virtual Tool (Aligned with Real Tool)</text>

  <!-- edges -->
  <g fill="none" stroke="#555" stroke-width="1.6">
    <path d="M500,150 L500,270" marker-end="url(#arr)"/>
    <path d="M650,150 L650,240 L912,240 L912,262" marker-end="url(#arr)"/>
    <path d="M660,395 L720,395" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M235,370 L300,370" marker-end="url(#arr)"/>
  </g>
  <text x="510" y="232" font-size="11" fill="#555">Tool Pose</text>
  <text x="770" y="232" font-size="11" fill="#555">Tool Pose</text>
  <text x="690" y="382" text-anchor="middle" font-size="11" fill="#555">Live Registration · Overlay</text>
  <text x="267" y="360" font-size="11" fill="#555">Shared MR View</text>
</svg>
