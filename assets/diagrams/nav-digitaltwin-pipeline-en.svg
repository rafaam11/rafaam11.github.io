<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1f2430">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="600" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="19" font-weight="700">Surgical Navigation → Patient Digital Twin → HoloLens AR</text>

  <text x="190" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4252">① Sensors · Inputs</text>
  <text x="990" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4252">③ Digital Twin · AR View</text>

  <!-- left inputs -->
  <rect x="40" y="110" width="300" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="190" y="148" text-anchor="middle">CT Segmentation 3D Model</text>
  <text x="190" y="170" text-anchor="middle" font-size="12" fill="#555">(Virtual Patient = Digital Twin)</text>

  <rect x="40" y="240" width="300" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="190" y="278" text-anchor="middle">Stereo-Vision Tracker</text>
  <text x="190" y="300" text-anchor="middle" font-size="12" fill="#555">(In-house Tracking System)</text>

  <rect x="40" y="370" width="300" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="190" y="420" text-anchor="middle">Patient Marker · Tool Marker</text>

  <!-- middle registration -->
  <rect x="430" y="120" width="320" height="210" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="590" y="152" text-anchor="middle" font-size="14" font-weight="700">Multi-Frame Registration (4×4 Rigid Transforms)</text>
  <text x="455" y="192">• Marker ↔ Tracker</text>
  <text x="455" y="226">• Tracker ↔ Surgical Tool</text>
  <text x="455" y="260">• Patient ↔ Patient Marker</text>

  <rect x="430" y="380" width="320" height="110" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="590" y="428" text-anchor="middle" font-weight="700">CT Coordinate Frame</text>
  <text x="590" y="452" text-anchor="middle" font-weight="700">Real-Time Tool Pose</text>

  <!-- right column -->
  <rect x="840" y="110" width="300" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="990" y="148" text-anchor="middle">Patient Digital Twin</text>
  <text x="990" y="170" text-anchor="middle" font-size="12" fill="#555">(Live Tool on the Twin)</text>

  <rect x="840" y="240" width="300" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="990" y="278" text-anchor="middle">HoloLens AR</text>
  <text x="990" y="300" text-anchor="middle" font-size="12" fill="#555">Virtual Patient + Tracked Tool</text>

  <rect x="840" y="370" width="300" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="990" y="408" text-anchor="middle" font-weight="700">Avoid Hidden Structures (Nerves)</text>
  <text x="990" y="430" text-anchor="middle" font-weight="700">+ Surgical-Plan Guide Overlay</text>

  <!-- edges -->
  <g fill="none" stroke="#555" stroke-width="1.6">
    <path d="M340,155 L375,155 L375,165 L430,165" marker-end="url(#arr)"/>
    <path d="M340,285 L390,285 L390,225 L430,225" marker-end="url(#arr)"/>
    <path d="M340,415 L405,415 L405,285 L430,285" marker-end="url(#arr)"/>
    <path d="M590,330 L590,380" marker-end="url(#arr)"/>
    <path d="M750,435 L795,435 L795,155 L840,155" marker-end="url(#arr)"/>
    <path d="M990,200 L990,240" marker-end="url(#arr)"/>
    <path d="M990,330 L990,370" marker-end="url(#arr)"/>
  </g>
  <text x="602" y="362" font-size="11" fill="#555">Composition</text>
  <text x="804" y="300" font-size="11" fill="#555">Real-Time Tracking</text>
</svg>
