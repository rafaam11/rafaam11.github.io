<main id="main-content" data-portfolio="case-study" data-project="respiratory-surface-guidance" tabindex="-1"><article class="td-case-fallback"><h1>표면유도 호흡추적 (SGRT)</h1><p>K-LINAC 대과제(주관 한국전기연구원, 세부주관 ETRI)의 디지트랙 위탁 연구로, 원거리 표면 재구성과 근거리 실시간 호흡 추적을 상용 3D 센서로 구현하는 초기 단계 연구입니다. 상용 시스템은 센서·알고리즘 선택 근거를 공개하지 않아, 국산 스택은 그 근거부터 직접 만들어야 합니다.</p><img src="../../assets/3d/sgrt-poc.webp" alt="삼각대 위 3D 깊이 센서가 앉은 사람의 흉부 ROI를 보고, 옆 화면에 호흡 파형과 게이트 신호 예시가 그려지는 3D 개념도" width="1600" height="1000"><a href="../../assets/pdfs/respiratory-surface-guidance-ko.pdf">사례 PDF 열기</a></article></main>
